# =============================================================================
#  Gaming Quiz Battle – Nginx DANS le conteneur "frontend"
#  Variante de deployment/nginx/gaming-quiz.conf :
#   - les fichiers statiques sont dans /usr/share/nginx/html
#   - l'API est joignable via le nom de service Docker "backend" (port 3000)
# =============================================================================

# Conserve le protocole d'origine transmis par un éventuel load balancer (https), sinon celui de Nginx.
map $http_x_forwarded_proto $gq_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream gaming_quiz_api {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;

    # --- En-têtes de sécurité (protection XSS / clickjacking / sniffing) ------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # À activer UNIQUEMENT quand tout le site est servi en HTTPS :
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Paramètres communs du reverse proxy ---------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gq_forwarded_proto;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # --- API REST ------------------------------------------------------------
    location /api/ {
        proxy_pass http://gaming_quiz_api;
    }

    # --- Health checks (supervision, load balancer éventuel) ---------------
    location = /health {
        proxy_pass http://gaming_quiz_api;
        access_log off;
    }
    location = /ready {
        proxy_pass http://gaming_quiz_api;
        access_log off;
    }

    # --- Fichiers statiques versionnés par Vite : cache long ----------------
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # --- Application React (SPA) : toutes les routes renvoient index.html ---
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
