# =============================================================================
#  Gaming Quiz Battle – TOUTE l'application en conteneurs, sur une seule machine
#
#    mysql     : base de données MySQL 8.4 (données dans le volume "mysql-data")
#    backend   : API Node.js/Express (crée les tables et les 140 questions au 1er démarrage)
#    frontend  : Nginx (site React + relais /api, /health, /ready) → port 80
#
#  Seul le port 80 est ouvert ; MySQL et l'API ne sont joignables qu'à
#  l'intérieur du réseau Docker.
#
#  Utilisation (depuis ce dossier) :
#    cp full.env.example .env        # puis choisir un mot de passe dans .env
#    docker compose -f compose.full.yml up -d --build
#    → http://<IP-de-la-machine>/
#
#  Arrêter : docker compose -f compose.full.yml down       (les données sont conservées)
#  Tout effacer, données comprises : docker compose -f compose.full.yml down -v
# =============================================================================
name: gaming-quiz-full

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gaming_quiz
      MYSQL_USER: quiz_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans le fichier .env (voir full.env.example)}
      # Mot de passe root aléatoire (affiché une seule fois dans les logs du 1er démarrage)
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uquiz_app -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
    image: gaming-quiz-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      INSTANCE_NAME: ${INSTANCE_NAME:-WEB-01}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_MIGRATE: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: gaming_quiz
      DB_USER: quiz_app
      DB_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans le fichier .env (voir full.env.example)}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/frontend.Dockerfile
    image: gaming-quiz-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mysql-data:
