# =============================================================================
#  Gaming Quiz Battle – déploiement Docker du serveur web
#
#  Lance 2 conteneurs :
#    frontend : Nginx (site React + relais /api, /health, /ready) → port 80 de la VM
#    backend  : API Node.js/Express → PAS exposé hors de Docker (réseau interne)
#
#  Configuration : fichier d'environnement (par défaut /etc/gaming-quiz/gaming-quiz.env)
#
#  Utilisation (depuis ce dossier) :
#    docker compose -f compose.web.yml up -d --build
#    docker compose -f compose.web.yml run --rm backend node dist/cli/db.js setup   # 1 seule fois
# =============================================================================
name: gaming-quiz

services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
    image: gaming-quiz-backend:latest
    restart: unless-stopped
    env_file:
      - ${GQ_ENV_FILE:-/etc/gaming-quiz/gaming-quiz.env}
    environment:
      # Valeurs imposées dans le conteneur (prioritaires sur le fichier d'environnement)
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/frontend.Dockerfile
    image: gaming-quiz-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
